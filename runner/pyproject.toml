[project]
name = "agent-sandbox-bench-runner"
version = "0.1.0"
description = "Runner CLI: loads tasks for any world, drives the agent loop, traces, grades and scores."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "agent-sandbox-bench-kit[mcp]==0.1.0",
  "agent-sandbox-bench-stress==0.1.0",
  "httpx>=0.28",
  "opentelemetry-api==1.45.1",
  "opentelemetry-sdk==1.45.1",
]

[project.optional-dependencies]
# Real model calls. Heavy (boto3, tokenizers, huggingface-hub, aiohttp), so CI,
# which only uses the fake models, never installs it. See DECISIONS.md.
litellm = ["litellm==1.104.2"]
# Span export to an OTLP collector or to Langfuse (decided by environment variables).
otlp = ["opentelemetry-exporter-otlp-proto-http==1.45.1"]

[project.scripts]
sandbox = "runner.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runner"]

[tool.uv.sources]
agent-sandbox-bench-kit = { workspace = true }
agent-sandbox-bench-stress = { workspace = true }
