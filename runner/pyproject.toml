[project]
name = "agent-sandbox-runner"
version = "0.0.1.dev0"
description = "Runner CLI: loads tasks for any world, drives the agent loop, traces, grades and scores."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["agent-sandbox-kit"]

[project.scripts]
sandbox = "runner.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runner"]

[tool.uv.sources]
agent-sandbox-kit = { workspace = true }
