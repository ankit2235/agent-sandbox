[project]
name = "agent-sandbox-stress"
version = "0.0.1.dev0"
description = "Generic, seeded stress modifiers and the machinery that applies any world's."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["agent-sandbox-kit"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stress"]

[tool.uv.sources]
agent-sandbox-kit = { workspace = true }
