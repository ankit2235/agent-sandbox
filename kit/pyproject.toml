[project]
name = "agent-sandbox-kit"
version = "0.0.1.dev0"
description = "Domain-neutral core kit: task, episode, trace, clock, rng, world registry, OpenEnv adapter."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "pydantic>=2.9",
  "httpx>=0.28",
  "pyyaml>=6.0",
  "jsonschema>=4.23",
]

[project.optional-dependencies]
# The MCP bridge (kit.mcp_bridge) needs the official MCP SDK; worlds that serve
# tools over MCP depend on this extra. See DECISIONS.md.
mcp = ["mcp==1.30.0"]

[project.entry-points."agent_sandbox.worlds"]
hello_world = "kit.examples.hello_world:world_spec"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kit"]
