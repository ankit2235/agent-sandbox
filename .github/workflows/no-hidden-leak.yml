name: no-hidden-leak

# Hidden tasks live in a separate private repository (HIDDEN_TASKS_DIR). This job
# fails if a hidden task, a canary or a copy of a published hidden task is in the
# public repository. It runs in CI, not only as a pre-commit hook.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  no-hidden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: no canary and no task marked hidden in any tracked file
        run: git ls-files -z | xargs -0 python3 scripts/check_no_hidden.py
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-packages
      - name: no task file matches a published hidden task's hash
        run: uv run sandbox hidden leaks kit runner stress guard training worlds scripts docs

  training-data:
    # The guard-model dataset: a small build with the same code as the full one, then the
    # leakage check (canaries, hidden ids and hashes, families across splits, near-duplicates
    # across splits). The check against the hidden set itself needs the private repository and
    # runs locally (`sandbox-train dataset hidden-check`).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-packages
      - name: build the CI-sized action dataset
        run: uv run sandbox-train dataset build --config ci --out "$RUNNER_TEMP/actions" --workers 4
      - name: no hidden task, canary or near-duplicate across splits in it
        run: uv run sandbox-train dataset check "$RUNNER_TEMP/actions/actions-v0.1-ci"
