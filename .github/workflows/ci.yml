name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-packages
      - name: lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: type-check (strict on the kit)
        run: |
          uv run mypy --strict kit/src/kit
          uv run mypy runner/src/runner stress/src/stress
          uv run mypy -p worlds.payments
          uv run mypy -p worlds.security
      - name: tests
        run: uv run pytest

  package:
    # A stranger's install: the six wheels, built here, into a clean virtualenv, then the
    # quickstart with the fake model. Nothing is published.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv build --all-packages --out-dir dist
      - name: install the wheels into a fresh virtualenv
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/clean"
          VIRTUAL_ENV="$RUNNER_TEMP/clean" uv pip install --find-links dist "agent-sandbox-bench==$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)"
      - name: sandbox worlds and the quickstart, from the installed package
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/clean/bin/sandbox" --version
          "$RUNNER_TEMP/clean/bin/sandbox" worlds
          "$RUNNER_TEMP/clean/bin/sandbox" tasks validate
          "$RUNNER_TEMP/clean/bin/sandbox" quickstart --model fake:golden --out quick
          "$RUNNER_TEMP/clean/bin/sandbox" verify --run quick
