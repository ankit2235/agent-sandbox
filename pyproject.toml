[project]
name = "agent-sandbox-bench"
version = "0.1.0"
description = "An OpenEnv-compatible sandbox platform that measures how well AI agents do real work inside simulated worlds."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Prarabdha Soni" }]
keywords = ["agents", "benchmark", "evaluation", "openenv", "mcp", "reinforcement-learning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "agent-sandbox-bench-kit==0.1.0",
  "agent-sandbox-bench-runner==0.1.0",
  "agent-sandbox-bench-stress==0.1.0",
  "agent-sandbox-bench-world-payments==0.1.0",
  "agent-sandbox-bench-world-security==0.1.0",
]

[project.optional-dependencies]
# OpenEnv is experimental upstream and pulls a heavy dependency tree, so the
# adapter is an extra rather than a hard dependency of the kit. See DECISIONS.md.
openenv = ["openenv==0.9.0"]
# Real model calls through LiteLLM, and OTLP span export (Langfuse or a collector).
litellm = ["agent-sandbox-bench-runner[litellm]==0.1.0"]
otlp = ["agent-sandbox-bench-runner[otlp]==0.1.0"]

[project.urls]
Homepage = "https://github.com/prarabdha-soni/agent-sandbox"
Documentation = "https://prarabdha-soni.github.io/agent-sandbox/"
Changelog = "https://github.com/prarabdha-soni/agent-sandbox/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.sdist]
# The umbrella package holds no code: its sdist carries only its metadata. Without this
# list hatch would pack every file in the checkout, tracked or not.
only-include = ["pyproject.toml", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.uv.workspace]
members = ["kit", "stress", "runner", "guard", "training", "worlds/payments", "worlds/security"]

[tool.uv.sources]
agent-sandbox-bench-kit = { workspace = true }
agent-sandbox-bench-guard = { workspace = true }
agent-sandbox-bench-training = { workspace = true }
agent-sandbox-bench-runner = { workspace = true }
agent-sandbox-bench-stress = { workspace = true }
agent-sandbox-bench-world-payments = { workspace = true }
agent-sandbox-bench-world-security = { workspace = true }

[dependency-groups]
# The docs site (mkdocs.yml); not installed by a plain `uv sync`.
docs = ["mkdocs-material==9.7.7"]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "hypothesis>=6.112",
  "ruff>=0.9",
  "mypy>=1.14",
  "pre-commit>=4.0",
  "fastapi>=0.116",
  "uvicorn>=0.34",
  "types-pyyaml>=6.0",
  "types-jsonschema>=4.23",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = [
  "kit/src",
  "runner/src",
  "stress/src",
  "guard/src",
  "training/src",
  "worlds/payments/src",
  "worlds/security/src",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "D"]
ignore = [
  "D100", "D104",                  # module/package docstrings not required everywhere
  "D105", "D107",                  # magic methods and __init__ document at class level
  "D203", "D213",                  # conflict with the formatter's docstring style
  "D205", "D400", "D401", "D415",  # summary-line punctuation fussiness
  "ANN401",                        # Any is deliberate in task/initial_state payloads
  "B008",                          # pydantic Field() in defaults
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["D", "ANN", "S101"]
"**/examples/**" = ["D"]

[tool.ruff.lint.isort]
known-first-party = ["kit", "runner", "stress", "guard", "training", "worlds"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
plugins = []

[[tool.mypy.overrides]]
# Optional extra; the adapter imports it lazily and is typed against Any.
module = ["openenv.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Optional extras; the runner imports them lazily and is typed against Any.
module = ["litellm.*", "opentelemetry.exporter.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The guard model's training and local inference (requirements-train.txt, never installed
# by the workspace or CI); imported lazily and typed against Any.
module = ["torch.*", "transformers.*", "peft.*", "trl.*", "datasets.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = [
  "kit/tests",
  "stress/tests",
  "runner/tests",
  "guard/tests",
  "training/tests",
  "worlds/payments/tests",
  "worlds/security/tests",
]
addopts = "-q --strict-markers --strict-config"
markers = [
  "openenv: requires the optional openenv extra to be installed",
]
filterwarnings = ["error::DeprecationWarning:kit.*"]
