[project]
name = "agent-sandbox-bench-world-security"
version = "0.1.0"
description = "The security-operations world (defensive only): services, scenarios, MCP tools, tasks and graders."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "agent-sandbox-bench-kit[mcp]==0.1.0",
  "agent-sandbox-bench-stress==0.1.0",
  "fastapi>=0.116",
]

[project.entry-points."agent_sandbox.worlds"]
security = "worlds.security:world_spec"

[project.entry-points."agent_sandbox.stress"]
security = "worlds.security.stress:STRESS"

[project.entry-points."agent_sandbox.training"]
security = "worlds.security.training"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worlds"]

[tool.uv.sources]
agent-sandbox-bench-kit = { workspace = true }
agent-sandbox-bench-stress = { workspace = true }
