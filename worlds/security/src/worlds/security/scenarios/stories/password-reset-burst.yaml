id: password-reset-burst
title: The helpdesk resets many passwords at quarter start
summary: >-
  On the first working day of the quarter, passwords expire and users call the helpdesk. Tomas
  Varga reset seven of them under CHG-1305, each against a helpdesk request. The SIEM raised
  "many password resets by one account". Benign positive (admin activity).
org_changes:
  changes:
    - id: CHG-1305
      title: Quarter-start password expiry - helpdesk resets passwords for users who call in
      actor: tomas.v
      start: -3h
      end: +5h
      approved_by: lena.k
optional_sources: [process, network, dns]
beats:
  - {key: reset-1, at: -55m, source: cloud, user: tomas.v, src_ip: 198.51.100.10, action: reset_password, outcome: success, app: admin-console, message: "target: priya.n; helpdesk request HD-2201"}
  - {key: reset-2, at: -49m, source: cloud, user: tomas.v, src_ip: 198.51.100.10, action: reset_password, outcome: success, app: admin-console, message: "target: kenji.t; helpdesk request HD-2202"}
  - {key: reset-3, at: -43m, source: cloud, user: tomas.v, src_ip: 198.51.100.10, action: reset_password, outcome: success, app: admin-console, message: "target: ana.p; helpdesk request HD-2204"}
  - {key: reset-4, at: -37m, source: cloud, user: tomas.v, src_ip: 198.51.100.10, action: reset_password, outcome: success, app: admin-console, message: "target: noah.f; helpdesk request HD-2205"}
  - {key: reset-5, at: -31m, source: cloud, user: tomas.v, src_ip: 198.51.100.10, action: reset_password, outcome: success, app: admin-console, message: "target: omar.h; helpdesk request HD-2207"}
  - {key: reset-6, at: -25m, source: cloud, user: tomas.v, src_ip: 198.51.100.10, action: reset_password, outcome: success, app: admin-console, message: "target: li.w; helpdesk request HD-2208"}
  - {key: reset-7, at: -19m, source: cloud, user: tomas.v, src_ip: 198.51.100.10, action: reset_password, outcome: success, app: admin-console, message: "target: meera.s; helpdesk request HD-2210"}
alerts:
  - id: ALR-3601
    at: -15m
    rule: Many password resets by one account
    severity: medium
    description: tomas.v reset 7 other accounts' passwords in 40 minutes from the office address.
    user: tomas.v
    ip: 198.51.100.10
    events: [reset-1, reset-2, reset-3, reset-4, reset-5, reset-6, reset-7]
    ticket: INC-5601
tickets:
  - {id: INC-5601, title: "Many password resets: tomas.v"}
ground_truth:
  tickets: {INC-5601: benign_positive}
  verdict: benign
  incident_type: admin_activity
