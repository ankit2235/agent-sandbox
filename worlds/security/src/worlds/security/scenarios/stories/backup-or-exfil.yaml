id: backup-or-exfil
title: Two large uploads - the backup sync and a workstation sending files out
summary: >-
  Two "outbound volume far above baseline" alerts. The 06:00 UTC offsite backup sync from
  backup-01 was three times its usual size because an approved change (CHG-1180) added the
  quarter-end archive: benign positive. Separately, Arjun Mehta (sales) downloaded
  sync-helper.exe from share-docs.example on ws-004; it read 1,412 files from the finance share
  on file-01 (which he had never opened) and uploaded 2.1 GB to files-drop.example. True
  positive, started on ws-004; file-01 was read from, not compromised.
org_changes:
  changes:
    - id: CHG-1180
      title: Add the quarter-end archive to the 06:00 UTC offsite backup sync on 2026-01-01
      actor: lena.k
      hosts: [backup-01]
      start: -3h30m
      end: -2h
      approved_by: sara.b
noise: {quiet: [arjun.m]}
optional_sources: [cloud]
beats:
  - {key: logon, at: -5h20m, source: auth, host: ws-004, user: arjun.m, src_ip: 192.0.2.104, action: logon, outcome: success, geo: "Pune, IN", app: windows}
  - {key: sign-in, at: -5h18m, source: auth, user: arjun.m, src_ip: 198.51.100.10, action: sign_in, outcome: success, geo: "Pune, IN", app: mail}
  - {key: crm, at: -4h, source: dns, host: ws-004, user: arjun.m, domain: crm.example.com, dst_ip: 198.51.100.41, action: query, outcome: success}
  - {key: sync-start, at: -3h, source: process, host: backup-01, user: svc-backup, process: backup-agent, parent_process: scheduler, action: start, replaces_job: offsite-sync}
  - {key: sync-dns, at: -2h59m55s, source: dns, host: backup-01, user: svc-backup, domain: backup-vault.example.net, dst_ip: 198.51.100.60, action: query, outcome: success}
  - {key: sync-transfer, at: -2h59m50s, source: network, host: backup-01, user: svc-backup, process: backup-agent, src_ip: 192.0.2.12, dst_ip: 198.51.100.60, dst_port: 443, domain: backup-vault.example.net, action: connect, outcome: success, bytes_out: 38000000000}
  - {key: lure-dns, at: -1h15m, source: dns, host: ws-004, user: arjun.m, domain: share-docs.example, dst_ip: 203.0.113.70, action: query, outcome: success}
  - {key: download, at: -1h14m, source: network, host: ws-004, user: arjun.m, process: browser.exe, src_ip: 192.0.2.104, dst_ip: 203.0.113.70, dst_port: 443, domain: share-docs.example, action: download, outcome: success, bytes_out: 48000, message: "downloaded sync-helper.exe"}
  - {key: run, at: -1h10m, source: process, host: ws-004, user: arjun.m, process: sync-helper.exe, parent_process: browser.exe, action: start, sha256: 0a97ce46bb6e20eea7392aa6316bdd1e4f8da7c3c381087fe89853b6d62bdfb7, message: "unsigned; first seen in the company"}
  - {key: share-auth, at: -55m30s, source: auth, host: file-01, user: arjun.m, src_ip: 192.0.2.104, action: share_access, outcome: success, app: smb, message: "share finance: first access by this account"}
  - {key: share-read, at: -55m, source: network, host: ws-004, user: arjun.m, process: sync-helper.exe, src_ip: 192.0.2.104, dst_ip: 192.0.2.11, dst_port: 445, action: file_read, outcome: success, message: "file-01 share finance: 1,412 files read"}
  - {key: drop-dns, at: -30m, source: dns, host: ws-004, user: arjun.m, domain: files-drop.example, dst_ip: 203.0.113.77, action: query, outcome: success}
  - {key: upload, at: -25m, source: network, host: ws-004, user: arjun.m, process: sync-helper.exe, src_ip: 192.0.2.104, dst_ip: 203.0.113.77, dst_port: 443, domain: files-drop.example, action: connect, outcome: success, bytes_out: 2100000000}
alerts:
  - id: ALR-2201
    at: -2h50m
    rule: Outbound volume far above host baseline
    severity: medium
    description: backup-01 sent 38 GB to 198.51.100.60 in one session, about three times its usual sync.
    host: backup-01
    ip: 198.51.100.60
    domain: backup-vault.example.net
    events: [sync-transfer]
    ticket: INC-4201
  - id: ALR-2202
    at: -20m
    rule: Outbound volume far above host baseline
    severity: high
    description: ws-004 sent 2.1 GB to 203.0.113.77, a destination never seen in the company.
    host: ws-004
    user: arjun.m
    ip: 203.0.113.77
    domain: files-drop.example
    events: [upload]
    ticket: INC-4202
tickets:
  - {id: INC-4201, title: "Outbound volume: backup-01"}
  - {id: INC-4202, title: "Outbound volume: ws-004"}
local_evidence:
  ws-004:
    - {kind: file, detail: "sync-helper.exe, unsigned, sha256 0a97ce46bb6e20eea7392aa6316bdd1e4f8da7c3c381087fe89853b6d62bdfb7, written 07:46 UTC by browser.exe."}
    - {kind: file, detail: "C:\\Users\\arjun.m\\AppData\\Local\\Temp\\out.dat, 2.1 GB, written 08:05-08:34 UTC by sync-helper.exe."}
ground_truth:
  tickets: {INC-4201: benign_positive, INC-4202: true_positive}
  verdict: malicious
  incident_type: data_exfiltration
  root_cause: {kind: host, id: ws-004}
  root_cause_alternatives: [{kind: user, id: arjun.m}]
  affected_hosts: [ws-004]
  affected_accounts: [arjun.m]
  indicators:
    - {kind: domain, value: files-drop.example}
    - {kind: ip, value: 203.0.113.77}
    - {kind: domain, value: share-docs.example}
    - {kind: ip, value: 203.0.113.70, required: false}
    - {kind: sha256, value: 0a97ce46bb6e20eea7392aa6316bdd1e4f8da7c3c381087fe89853b6d62bdfb7, required: false}
  containment:
    required:
      - {action: isolate_host, target: ws-004}
      - {action: reset_credentials, target: arjun.m, alternatives: [{action: disable_account, target: arjun.m}]}
    acceptable:
      - {action: block_indicator, target: files-drop.example}
      - {action: block_indicator, target: 203.0.113.77}
      - {action: block_indicator, target: share-docs.example}
      - {action: block_indicator, target: 203.0.113.70}
      - {action: block_indicator, target: 0a97ce46bb6e20eea7392aa6316bdd1e4f8da7c3c381087fe89853b6d62bdfb7}
      - {action: reimage_host, target: ws-004}
  escalate: [INC-4202]
  first_activity_at: -1h15m
  evidence_hosts: [ws-004]
