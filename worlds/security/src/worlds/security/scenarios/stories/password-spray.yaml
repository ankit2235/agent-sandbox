  - {key: mailbox-search, at: -44m, source: cloud, user: omar.h, src_ip: 203.0.113.99, action: mailbox_search, outcome: success, app: mail, message: "search: invoice"}
alerts:
  - id: ALR-2401
    at: -45m
    rule: Many accounts failed sign-in from one address
    severity: medium
    description: 203.0.113.99 failed to sign in to 12 different mail accounts within 8 minutes.
    ip: 203.0.113.99
    events: [spray-lena-k#1, spray-tomas-v#1, spray-priya-n#1, spray-arjun-m#1]
    ticket: INC-4401
  - id: ALR-2402
    at: -43m
    rule: Successful sign-in after repeated failures
    severity: high
    description: omar.h signed in from 203.0.113.99 seconds after failed attempts from the same address.
    user: omar.h
    ip: 203.0.113.99
    events: [spray-omar-h#1, spray-omar-h#2, omar-success]
    ticket: INC-4401
tickets:
  - id: INC-4401
    title: "Password spray from 203.0.113.99"
    classification: true_positive
    escalated_at: -35m
    comments:
      - at: -20m
        author: IR on-call (D. Mensah)
        body: >-
          Contained in the identity console: omar.h's password reset, sessions revoked, inbox rule
          removed. Day shift: please write and submit the incident report on this ticket.
ground_truth:
  tickets: {INC-4401: true_positive}
  verdict: malicious
  incident_type: password_spray
  root_cause: {kind: user, id: omar.h}
  affected_accounts: [omar.h]
  indicators:
    - {kind: ip, value: 203.0.113.99}
  containment:
    required:
      - {action: reset_credentials, target: omar.h, alternatives: [{action: disable_account, target: omar.h}]}
    acceptable:
      - {action: block_indicator, target: 203.0.113.99}
  first_activity_at: -55m
