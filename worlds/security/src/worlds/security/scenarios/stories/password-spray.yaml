id: password-spray
title: Password spray against mail, one account taken over
summary: >-
  From 203.0.113.99 (a hosting provider), someone tried two passwords against twelve mail
  accounts between 08:05 and 08:13 UTC. Omar Haddad's second attempt succeeded at 08:09:30. The
  same address then created an inbox rule hiding mail from finance and searched his mailbox for
  invoices. IR has reset the account. Only omar.h is compromised; the other eleven only saw failed
  sign-ins. The report is the task.
optional_sources: [process, network, dns]
beats:
  - {key: spray-lena-k, at: -55m, source: auth, user: lena.k, src_ip: 203.0.113.99, action: sign_in, outcome: failure, geo: "unknown (hosting provider)", app: mail, message: "bad password", repeat: {every: 20s, times: 2}}
  - {key: spray-tomas-v, at: -54m20s, source: auth, user: tomas.v, src_ip: 203.0.113.99, action: sign_in, outcome: failure, geo: "unknown (hosting provider)", app: mail, message: "bad password", repeat: {every: 20s, times: 2}}
  - {key: spray-priya-n, at: -53m40s, source: auth, user: priya.n, src_ip: 203.0.113.99, action: sign_in, outcome: failure, geo: "unknown (hosting provider)", app: mail, message: "bad password", repeat: {every: 20s, times: 2}}
  - {key: spray-arjun-m, at: -53m, source: auth, user: arjun.m, src_ip: 203.0.113.99, action: sign_in, outcome: failure, geo: "unknown (hosting provider)", app: mail, message: "bad password", repeat: {every: 20s, times: 2}}
  - {key: spray-meera-s, at: -52m20s, source: auth, user: meera.s, src_ip: 203.0.113.99, action: sign_in, outcome: failure, geo: "unknown (hosting provider)", app: mail, message: "bad password", repeat: {every: 20s, times: 2}}
  - {key: spray-dev-r, at: -51m40s, source: auth, user: dev.r, src_ip: 203.0.113.99, action: sign_in, outcome: failure, geo: "unknown (hosting provider)", app: mail, message: "bad password", repeat: {every: 20s, times: 2}}
  - {key: spray-omar-h, at: -51m, source: auth, user: omar.h, src_ip: 203.0.113.99, action: sign_in, outcome: failure, geo: "unknown (hosting provider)", app: mail, message: "bad password", repeat: {every: 20s, times: 2}}
  - {key: spray-sara-b, at: -50m20s, source: auth, user: sara.b, src_ip: 203.0.113.99, action: sign_in, outcome: failure, geo: "unknown (hosting provider)", app: mail, message: "bad password", repeat: {every: 20s, times: 2}}
  - {key: spray-kenji-t, at: -49m40s, source: auth, user: kenji.t, src_ip: 203.0.113.99, action: sign_in, outcome: failure, geo: "unknown (hosting provider)", app: mail, message: "bad password", repeat: {every: 20s, times: 2}}
  - {key: spray-ana-p, at: -49m, source: auth, user: ana.p, src_ip: 203.0.113.99, action: sign_in, outcome: failure, geo: "unknown (hosting provider)", app: mail, message: "bad password", repeat: {every: 20s, times: 2}}
  - {key: spray-li-w, at: -48m20s, source: auth, user: li.w, src_ip: 203.0.113.99, action: sign_in, outcome: failure, geo: "unknown (hosting provider)", app: mail, message: "bad password", repeat: {every: 20s, times: 2}}
  - {key: spray-noah-f, at: -47m40s, source: auth, user: noah.f, src_ip: 203.0.113.99, action: sign_in, outcome: failure, geo: "unknown (hosting provider)", app: mail, message: "bad password", repeat: {every: 20s, times: 2}}
  - {key: omar-success, at: -50m30s, source: auth, user: omar.h, src_ip: 203.0.113.99, action: sign_in, outcome: success, geo: "unknown (hosting provider)", app: mail, message: "new device"}
