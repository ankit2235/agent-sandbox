id: scanner-sweep
title: The weekly vulnerability scan looks like a port scan
summary: >-
  scan-01, the company's vulnerability scanner, swept the server subnet with its service account
  inside the approved Thursday scan window (CHG-1301). The SIEM raised "port scan from an
  internal host". Benign positive (security testing): classify and close, contain nothing.
org_changes:
  changes:
    - id: CHG-1301
      title: Weekly vulnerability scan of the server subnet by scan-01, Thursdays 07:00-09:30 UTC
      actor: svc-scanner
      hosts: [scan-01, dc-01, file-01, backup-01, jump-01, web-prod-01, db-prod-01, build-01]
      start: -2h
      end: +30m
      approved_by: lena.k
optional_sources: [process]
beats:
  - {key: scanner-start, at: -1h52m, source: process, host: scan-01, user: svc-scanner, process: vuln-scanner, parent_process: scheduler, action: start, message: "profile: weekly-servers"}
  - {key: probe-dc, at: -1h50m, source: network, host: scan-01, user: svc-scanner, process: vuln-scanner, src_ip: 192.0.2.31, dst_ip: 192.0.2.10, action: connect, outcome: failure, message: "connection attempts to 1,024 ports"}
  - {key: probe-file, at: -1h45m, source: network, host: scan-01, user: svc-scanner, process: vuln-scanner, src_ip: 192.0.2.31, dst_ip: 192.0.2.11, action: connect, outcome: failure, message: "connection attempts to 1,024 ports"}
  - {key: probe-backup, at: -1h40m, source: network, host: scan-01, user: svc-scanner, process: vuln-scanner, src_ip: 192.0.2.31, dst_ip: 192.0.2.12, action: connect, outcome: failure, message: "connection attempts to 1,024 ports"}
  - {key: probe-jump, at: -1h35m, source: network, host: scan-01, user: svc-scanner, process: vuln-scanner, src_ip: 192.0.2.31, dst_ip: 192.0.2.13, action: connect, outcome: failure, message: "connection attempts to 1,024 ports"}
  - {key: probe-web, at: -1h30m, source: network, host: scan-01, user: svc-scanner, process: vuln-scanner, src_ip: 192.0.2.31, dst_ip: 192.0.2.20, action: connect, outcome: failure, message: "connection attempts to 1,024 ports"}
  - {key: probe-db, at: -1h25m, source: network, host: scan-01, user: svc-scanner, process: vuln-scanner, src_ip: 192.0.2.31, dst_ip: 192.0.2.21, action: connect, outcome: failure, message: "connection attempts to 1,024 ports"}
  - {key: probe-build, at: -1h20m, source: network, host: scan-01, user: svc-scanner, process: vuln-scanner, src_ip: 192.0.2.31, dst_ip: 192.0.2.30, action: connect, outcome: failure, message: "connection attempts to 1,024 ports"}
alerts:
  - id: ALR-3201
    at: -1h10m
    rule: Port scan from an internal host
    severity: medium
    description: 192.0.2.31 (scan-01) probed over 1,000 ports on 7 servers in 30 minutes.
    host: scan-01
    user: svc-scanner
    ip: 192.0.2.31
    events: [probe-dc, probe-file, probe-backup, probe-jump]
    ticket: INC-5201
tickets:
  - {id: INC-5201, title: "Port scan from scan-01"}
ground_truth:
  tickets: {INC-5201: benign_positive}
  verdict: benign
  incident_type: security_testing
