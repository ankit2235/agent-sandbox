# Example Corp: the default simulated company. Synthetic people, RFC 5737 addresses and
# RFC 2606 domains only. Stories add to it or change it through `org_changes`.
name: Example Corp
domain: corp.example
office: {location: "Pune, IN", egress_ip: 198.51.100.10}

