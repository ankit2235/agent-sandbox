jobs:
  - id: offsite-sync
    title: Offsite backup sync to the backup provider
    host: backup-01
    user: svc-backup
    process: backup-agent
    every_hours: 6
    minute_of_day: 0
    dst_ip: 198.51.100.60
    domain: backup-vault.example.net
    bytes_out: 12000000000

business_indicators:
  - {kind: domain, value: backup-vault.example.net, purpose: Offsite backup provider, criticality: high}
  - {kind: ip, value: 198.51.100.60, purpose: Offsite backup provider, criticality: high}
  - {kind: domain, value: mail.example.net, purpose: Hosted email, criticality: critical}
  - {kind: ip, value: 198.51.100.40, purpose: Hosted email, criticality: critical}
  - {kind: domain, value: crm.example.com, purpose: Sales CRM, criticality: high}
  - {kind: domain, value: docs.example.org, purpose: Document collaboration, criticality: medium}
  - {kind: domain, value: updates.example.org, purpose: Operating system updates, criticality: medium}

