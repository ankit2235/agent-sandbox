id: reporting-password-spray
version: v0.1
world: security
category: reporting
difficulty: medium
instruction: >-
  You are the SOC analyst on shift at Example Corp. INC-4401 has been contained by the IR team.
  Investigate it and submit the incident report on that ticket: verdict, incident type, root
  cause, affected hosts and accounts, indicators, and when the activity started.
initial_state:
  scenario: password-spray
allowed_tools:
  [list_alerts, get_alert, search_logs, timeline, get_host, get_user, collect_evidence, isolate_host, disable_account, reset_credentials, block_indicator, restore, reimage_host, update_ticket, escalate, submit_report, ask_user]
max_steps: 15
grader: worlds.security.graders.reporting:password_spray
seed: 304
tags: [password-spray, identity, report]
visibility: public
expected_outcome: >-
  Report on INC-4401: malicious password spray; root cause and only affected account omar.h (the
  other eleven accounts only had failed sign-ins); no hosts; indicator 203.0.113.99; first
  activity 08:05 UTC (within five minutes).
reviewer_signoff: null
