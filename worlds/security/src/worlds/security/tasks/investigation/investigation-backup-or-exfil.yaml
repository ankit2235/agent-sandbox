id: investigation-backup-or-exfil
version: v0.1
world: security
category: investigation
difficulty: medium
instruction: >-
  You are the SOC analyst on shift at Example Corp. Two outbound-volume alerts are in the queue.
  Investigate both. Classify each ticket, and close any that is not a real incident. Escalate any
  real incident before its SLA runs out, and submit a report on its ticket with its root cause,
  the affected hosts and accounts, and its indicators. The IR team handles containment.
initial_state:
  scenario: backup-or-exfil
allowed_tools:
  [list_alerts, get_alert, search_logs, timeline, get_host, get_user, collect_evidence, isolate_host, disable_account, reset_credentials, block_indicator, restore, reimage_host, update_ticket, escalate, submit_report, ask_user]
max_steps: 20
grader: worlds.security.graders.investigation:backup_or_exfil
seed: 302
tags: [benign-lookalike, backup, exfiltration, scope]
visibility: public
expected_outcome: >-
  INC-4201 (backup-01) is the approved quarter-end backup sync: benign, closed. INC-4202 is real
  and escalated within its SLA: sync-helper.exe downloaded on ws-004 read the finance share and
  uploaded 2.1 GB to files-drop.example. Report: root cause ws-004 (or arjun.m), affected host
  ws-004 only (file-01 was read from, not compromised), account arjun.m, indicators
  files-drop.example, 203.0.113.77 and share-docs.example.
reviewer_signoff: null
