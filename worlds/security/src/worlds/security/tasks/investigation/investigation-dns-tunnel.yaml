id: investigation-dns-tunnel
version: v0.1
world: security
category: investigation
difficulty: medium
instruction: >-
  You are the SOC analyst on shift at Example Corp. Investigate ticket INC-6501 and its alert.
  Classify the ticket and, if it is a real incident, escalate it before its SLA runs out. Then
  submit a report on it with its root cause, the affected hosts and accounts, and its indicators.
  The IR team handles containment.
initial_state:
  scenario: dns-tunnel
allowed_tools:
  [list_alerts, get_alert, search_logs, timeline, get_host, get_user, collect_evidence, isolate_host, disable_account, reset_credentials, block_indicator, restore, reimage_host, update_ticket, escalate, submit_report, ask_user]
max_steps: 15
grader: worlds.security.graders.investigation:dns_tunnel
seed: 328
tags: [malware, dns, scope]
visibility: public
expected_outcome: >-
  INC-6501 true positive and escalated. Report: root cause ws-012 (or noah.f); affected host
  ws-012, no account; indicators data-sync.example and drivers-free.example.
reviewer_signoff: null
