task: reporting-password-spray
runs:
  golden:
    steps:
      - {tool: get_alert, args: {alert_id: ALR-2401}}
      - {tool: get_alert, args: {alert_id: ALR-2402}}
      - {tool: search_logs, args: {source: auth, ip: 203.0.113.99}, expect: {total: 25}}
      - {tool: timeline, args: {entity: omar.h, since: "2026-01-01T08:00:00Z"}}
      - &report
        tool: submit_report
        args:
          ticket_id: INC-4401
          verdict: malicious
          incident_type: password_spray
          root_cause: {kind: user, id: omar.h}
          affected_hosts: []
          affected_accounts: [omar.h]
          indicators: [{kind: ip, value: 203.0.113.99}]
          first_activity_at: "2026-01-01T08:05:00Z"
          narrative: "Two passwords tried against 12 accounts; omar.h's worked; inbox rule and search followed."
  wrong_lists_every_targeted_account:
    fails_with: security.incomplete_report
    steps:
      - {tool: get_alert, args: {alert_id: ALR-2401}}
      - tool: submit_report
        args:
          ticket_id: INC-4401
          verdict: malicious
          incident_type: password_spray
          root_cause: {kind: user, id: omar.h}
          affected_accounts: [lena.k, tomas.v, priya.n, arjun.m, meera.s, dev.r, omar.h, sara.b, kenji.t, ana.p, li.w, noah.f]
          indicators: [{kind: ip, value: 203.0.113.99}]
          first_activity_at: "2026-01-01T08:05:00Z"
  wrong_dates_it_from_the_alert:
    fails_with: security.incomplete_report
    steps:
      - {tool: get_alert, args: {alert_id: ALR-2402}}
      - tool: submit_report
        args:
          ticket_id: INC-4401
          verdict: malicious
          incident_type: password_spray
          root_cause: {kind: user, id: omar.h}
          affected_accounts: [omar.h]
          indicators: [{kind: ip, value: 203.0.113.99}]
          first_activity_at: "2026-01-01T08:15:00Z"
  wrong_blames_the_address:
    fails_with: security.wrong_root_cause
    steps:
      - {tool: get_alert, args: {alert_id: ALR-2401}}
      - tool: submit_report
        args:
          ticket_id: INC-4401
          verdict: malicious
          incident_type: password_spray
          root_cause: {kind: indicator, id: 203.0.113.99}
          affected_accounts: [omar.h]
          indicators: [{kind: ip, value: 203.0.113.99}]
          first_activity_at: "2026-01-01T08:05:00Z"
