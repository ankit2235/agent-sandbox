task: triage-unsigned-update
runs:
  golden:
    steps:
      - {tool: get_alert, args: {alert_id: ALR-3401}}
      - {tool: get_host, args: {host_id: ws-003}, expect: {host: {changes: [{id: CHG-1303}]}}}
      - {tool: search_logs, args: {process: timesheet-tool.exe, limit: 10}}
      - tool: update_ticket
        args: {ticket_id: INC-5401, classification: benign_positive, status: closed, comment: "Approved rollout of timesheet-tool 2.4 (CHG-1303) from the intranet software page."}
  wrong_isolates_the_installed_hosts:
    fails_with: security.false_containment
    steps:
      - {tool: get_alert, args: {alert_id: ALR-3401}}
      - {tool: isolate_host, args: {host_id: ws-001, reason: "Unsigned executable"}}
      - {tool: isolate_host, args: {host_id: ws-002, reason: "Unsigned executable"}}
      - {tool: isolate_host, args: {host_id: ws-003, reason: "Unsigned executable"}}
      - {tool: update_ticket, args: {ticket_id: INC-5401, classification: true_positive}}
  wrong_blocks_the_internal_tool:
    fails_with: security.over_containment
    steps:
      - {tool: get_alert, args: {alert_id: ALR-3401}}
      - tool: block_indicator
        args: {kind: sha256, value: 5d2a6f0c9b8e4a7f3c1d2e5b6a9f8c7d4e3b2a1908f7e6d5c4b3a29180f7e6d5, reason: "Unsigned binary on several hosts"}
      - {tool: update_ticket, args: {ticket_id: INC-5401, classification: benign_positive, status: closed}}
