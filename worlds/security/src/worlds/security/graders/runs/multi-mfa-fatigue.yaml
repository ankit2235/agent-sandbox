task: multi-mfa-fatigue
runs:
  golden:
    steps:
      - {tool: get_alert, args: {alert_id: ALR-4101}}
      - {tool: get_alert, args: {alert_id: ALR-4102}}
      - {tool: escalate, args: {ticket_id: INC-6101, severity: high, summary: "Takeover of sara.b; resetting now."}}
      - {tool: reset_credentials, args: {user_id: sara.b, reason: "Account taken over after MFA push flood"}}
      - {tool: block_indicator, args: {kind: domain, value: pay-portal.example, reason: "Forwarding target"}}
      - {tool: update_ticket, args: {ticket_id: INC-6101, classification: true_positive}}
      - &report
        tool: submit_report
        args:
          ticket_id: INC-6101
          verdict: malicious
          incident_type: account_takeover
          root_cause: {kind: user, id: sara.b}
          affected_hosts: []
          affected_accounts: [sara.b]
          indicators: [{kind: ip, value: 203.0.113.180}, {kind: domain, value: pay-portal.example}]
          first_activity_at: "2026-01-01T08:28:00Z"
  wrong_resets_too_late:
    fails_with: security.missed_compromise
    steps:
      - {tool: get_alert, args: {alert_id: ALR-4101}}
      - {tool: get_alert, args: {alert_id: ALR-4102}}
      - {tool: escalate, args: {ticket_id: INC-6101, severity: high, summary: "Takeover of sara.b."}}
      - {tool: update_ticket, args: {ticket_id: INC-6101, classification: true_positive}}
      - {tool: timeline, args: {entity: sara.b}}
      - {tool: search_logs, args: {ip: 203.0.113.180}}
      - {tool: get_user, args: {user_id: sara.b}}
      - {tool: search_logs, args: {domain: pay-portal.example}}
      - {tool: search_logs, args: {user: sara.b, source: cloud}}
      - {tool: get_host, args: {host_id: ws-008}}
      - {tool: timeline, args: {entity: ws-008}}
      - {tool: search_logs, args: {user: sara.b, source: auth}}
      - *report
      - {tool: update_ticket, args: {ticket_id: INC-6101, comment: "Report filed; resetting the account next."}}
      - {tool: reset_credentials, args: {user_id: sara.b, reason: "Account taken over"}}
