task: multi-password-reset-burst
runs:
  golden:
    steps:
      - {tool: get_alert, args: {alert_id: ALR-3601}}
      - {tool: get_user, args: {user_id: tomas.v}}
      - {tool: update_ticket, args: {ticket_id: INC-5601, classification: benign_positive, status: closed}}
      - tool: submit_report
        args: {ticket_id: INC-5601, verdict: benign, incident_type: admin_activity, narrative: "Helpdesk resets on request under CHG-1305."}
  wrong_forgets_the_report:
    fails_with: security.incomplete_report
    steps:
      - {tool: get_alert, args: {alert_id: ALR-3601}}
      - {tool: update_ticket, args: {ticket_id: INC-5601, classification: benign_positive, status: closed}}
  wrong_resets_the_helpdesk_account:
    fails_with: security.false_containment
    steps:
      - {tool: get_alert, args: {alert_id: ALR-3601}}
      - {tool: reset_credentials, args: {user_id: tomas.v, reason: "Unusual number of resets"}}
      - {tool: update_ticket, args: {ticket_id: INC-5601, classification: benign_positive, status: closed}}
      - tool: submit_report
        args: {ticket_id: INC-5601, verdict: benign, incident_type: admin_activity}
