task: triage-password-reset-burst
runs:
  golden:
    steps:
      - {tool: get_alert, args: {alert_id: ALR-3601}}
      - {tool: get_user, args: {user_id: tomas.v}, expect: {user: {changes: [{id: CHG-1305}]}}}
      - tool: update_ticket
        args: {ticket_id: INC-5601, classification: benign_positive, status: closed, comment: "Quarter-start expiry resets under CHG-1305, each with a helpdesk request."}
  wrong_disables_the_helpdesk:
    fails_with: security.false_containment
    steps:
      - {tool: get_alert, args: {alert_id: ALR-3601}}
      - {tool: disable_account, args: {user_id: tomas.v, reason: "Mass password resets"}}
      - {tool: escalate, args: {ticket_id: INC-5601, severity: high, summary: "tomas.v reset 7 passwords."}}
      - {tool: update_ticket, args: {ticket_id: INC-5601, classification: true_positive}}
