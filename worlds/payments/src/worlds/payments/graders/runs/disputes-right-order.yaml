task: disputes-right-order
runs:
  golden:
    steps:
      - {tool: read_inbox, save: inbox}
      - tool: get_order
        args: {order_id: $inbox.messages.3.order_id}
        save: order
        expect: {order: {merchant_id: mixup-goods, status: wrong_item}}
      - tool: request_refund
        args: {order_id: $order.order.id, amount_paise: 59900, reason: "Wrong item delivered."}
      - {tool: wait, args: {hours: 24}}
      - tool: get_order
        args: {order_id: $order.order.id}
        expect: {refund_requests: [{status: accepted}]}
  wrong_refunds_the_first_order_it_finds:
    fails_with: payments.false_claim
    steps:
      - {tool: read_inbox, save: inbox}
      - tool: get_order
        args: {order_id: $inbox.messages.0.order_id}
        save: order
        expect: {order: {merchant_id: honest-goods}}
      - tool: request_refund
        args: {order_id: $order.order.id, amount_paise: 149900, reason: "Wrong item delivered."}
      - {tool: wait, args: {hours: 24}}
