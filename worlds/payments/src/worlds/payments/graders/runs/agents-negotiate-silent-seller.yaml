task: agents-negotiate-silent-seller
runs:
  golden:
    steps:
      - {tool: list_deals}
      - {tool: make_offer, args: {deal_id: deal-camera, price_paise: 180000}}
      - {tool: wait, args: {hours: 24}}
      - {tool: list_deals, expect: {deals: [{status: open, awaiting: seller}]}}
      - tool: ask_user
        args: {question: "Lens Bazaar has not answered my ₹1,800 offer for a day. Keep waiting, or
                          leave it?"}
  wrong_buys_at_the_list_price:
    fails_with: payments.overspend
    steps:
      - {tool: make_offer, args: {deal_id: deal-camera, price_paise: 180000}}
      - {tool: wait, args: {hours: 24}}
      - tool: add_to_cart
        args: {merchant_id: lens-bazaar, product_id: lens-camera, quantity: 1}
      - {tool: checkout, args: {merchant_id: lens-bazaar}, save: co}
      - tool: pay
        args: {order_id: $co.order.id, payee: $co.payment_request.payee,
               amount_paise: $co.payment_request.amount_paise, idempotency_key: camera-1}
        expect: {outcome: paid}
