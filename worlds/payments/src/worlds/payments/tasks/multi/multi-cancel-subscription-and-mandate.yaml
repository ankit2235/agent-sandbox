id: multi-cancel-subscription-and-mandate
version: v0.1
world: payments
category: multi
difficulty: easy
instruction: >-
  I'm done with BoxCo. Cancel my subscription and make sure they can't debit me again.
initial_state:
  user: asha@sandbox
  rails:
    accounts:
      - {handle: asha@sandbox, holder: Asha Example, balance_paise: 5000000}
      - {handle: boxco@sandbox, holder: BoxCo Snacks, kind: merchant}
    mandates:
      - {id: mdt-boxco, payer: asha@sandbox, payee: boxco@sandbox, type: recurring,
         frequency: monthly, max_amount_paise: 29900, start_offset_seconds: -2332800}
  commerce:
    merchants:
      - {id: boxco, name: BoxCo Snacks, handle: boxco@sandbox, category: food, profile: honest}
    plans:
      - {id: box-basic, merchant_id: boxco, name: Basic box, price_paise: 29900, frequency: monthly}
    subscriptions:
      - {id: sub-box, plan_id: box-basic, mandate_id: mdt-boxco, next_billing_after_seconds: 259200}
allowed_tools:
  [read_page, get_order, list_transactions, list_mandates, pause_mandate, revoke_mandate,
   change_subscription, read_inbox, wait, ask_user]
max_steps: 10
grader: worlds.payments.graders.multi:cancel_subscription_and_mandate
seed: 502
tags: [subscription, cancel, mandate, revoke]
visibility: public
expected_outcome: >-
  sub-box is cancelled with BoxCo, and its mandate mdt-boxco is revoked, so the renewal due in
  three days never happens.
reviewer_signoff: null
