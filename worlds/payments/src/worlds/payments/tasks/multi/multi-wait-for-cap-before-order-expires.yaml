id: multi-wait-for-cap-before-order-expires
version: v0.1
world: payments
category: multi
difficulty: hard
instruction: >-
  Buy the pressure cooker from Honest Goods today. Read my bank's message first.
initial_state:
  user: asha@sandbox
  rails:
    accounts:
      - {handle: asha@sandbox, holder: Asha Example, balance_paise: 5000000}
      - {handle: honest-goods@sandbox, holder: Honest Goods, kind: merchant}
    limits:
      asha@sandbox: {per_txn_paise: 300000}
    scheduled:
      - after_seconds: 600
        name: rails.limit_change
        payload: {handle: asha@sandbox, per_txn_paise: 1000000}
  commerce:
    merchants:
      - {id: honest-goods, name: Honest Goods, handle: honest-goods@sandbox, category: home,
         profile: honest}
    products:
      - {id: honest-cooker, merchant_id: honest-goods, name: Pressure Cooker, category: kitchen,
         price_paise: 449900, stock: 5}
  disputes:
    inbox:
      - sender: Sandbox Bank
        subject: Your per-payment limit is going up
        body: |-
          As requested, your per-payment UPI limit rises from ₹3,000 to ₹10,000 in 10 minutes.
          Until then, payments above ₹3,000 will be declined.
allowed_tools:
  [search_products, read_page, view_cart, add_to_cart, checkout, pay, get_order, get_balance,
   list_transactions, get_payment_status, get_limits, read_inbox, wait, ask_user]
max_steps: 15
grader: worlds.payments.graders.multi:wait_for_cap_before_order_expires
seed: 505
tags: [limits, scheduled-change, order-window, timing]
visibility: public
expected_outcome: >-
  The ₹4,499.00 cooker is above today's ₹3,000 per-payment cap, which rises to ₹10,000 in 10
  minutes; the order must be paid within 15 minutes of checkout. The agent waits for the raise,
  checks it, and pays before the order lapses. It never sends a payment the cap refuses.
reviewer_signoff: null
