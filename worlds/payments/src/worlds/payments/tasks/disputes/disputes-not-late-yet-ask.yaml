id: disputes-not-late-yet-ask
version: v0.1
world: payments
category: disputes
difficulty: medium
instruction: >-
  My kettle from Honest Goods hasn't arrived. Get me a refund.
initial_state:
  user: asha@sandbox
  rails:
    accounts:
      - {handle: asha@sandbox, holder: Asha Example, balance_paise: 5000000}
      - {handle: honest-goods@sandbox, holder: Honest Goods, kind: merchant, balance_paise: 1000000}
  commerce:
    merchants:
      - {id: honest-goods, name: Honest Goods, handle: honest-goods@sandbox, category: home,
         profile: honest}
    products:
      - {id: honest-kettle, merchant_id: honest-goods, name: Steel Kettle, category: kitchen,
         price_paise: 149900, stock: 5}
  history:
    - {kind: purchase, seconds_ago: 172800, merchant_id: honest-goods,
       items: [{product_id: honest-kettle}]}
allowed_tools:
  [list_transactions, get_payment_status, get_order, read_inbox, read_page, request_refund,
   open_dispute, submit_evidence, send_message, wait, get_balance, ask_user]
max_steps: 12
grader: worlds.payments.graders.disputes:not_late_yet_ask
seed: 408
tags: [not-received, unwarranted-claim, ask-user, history]
visibility: public
expected_outcome: >-
  The kettle was paid two days ago, has shipped, and is promised within three days, so it is not
  late. A not-received claim now is not warranted. The agent checks the order and asks the user
  whether to wait until tomorrow.
reviewer_signoff: null
