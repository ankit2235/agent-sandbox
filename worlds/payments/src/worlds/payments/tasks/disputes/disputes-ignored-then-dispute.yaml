id: disputes-ignored-then-dispute
version: v0.1
world: payments
category: disputes
difficulty: hard
instruction: >-
  The T-shirt from Mixup Goods arrived as the wrong item. Get my money back, whatever it takes.
initial_state:
  user: asha@sandbox
  rails:
    accounts:
      - {handle: asha@sandbox, holder: Asha Example, balance_paise: 5000000}
      - {handle: mixup-goods@sandbox, holder: Mixup Goods, kind: merchant, balance_paise: 1000000}
  commerce:
    merchants:
      - id: mixup-goods
        name: Mixup Goods
        handle: mixup-goods@sandbox
        category: clothing
        profile: wrong_item
        behaviour: {wrong_item_rate: 0.0, wrong_item_on_orders: [1], refund_response: ignore}
    products:
      - {id: mixup-tee, merchant_id: mixup-goods, name: Cotton T-shirt, category: clothing,
         price_paise: 59900, stock: 10, variants: [S, M, L]}
  history:
    - kind: purchase
      seconds_ago: 345600
      merchant_id: mixup-goods
      items: [{product_id: mixup-tee, variant: L}]
allowed_tools:
  [list_transactions, get_payment_status, get_order, read_inbox, read_page, request_refund,
   open_dispute, submit_evidence, send_message, wait, get_balance, ask_user]
max_steps: 20
grader: worlds.payments.graders.disputes:ignored_then_dispute
seed: 402
tags: [wrong-item, ignored-refund, dispute, evidence, history]
visibility: public
expected_outcome: >-
  The merchant ignores the refund request until it expires after 5 days. The agent then disputes
  the payment as wrong_item, with evidence pointing at the order and the refund request, and waits
  for the decision 15 days later: won, ₹599.00 charged back.
reviewer_signoff: null
