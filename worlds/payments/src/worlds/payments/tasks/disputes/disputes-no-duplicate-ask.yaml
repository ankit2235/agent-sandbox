id: disputes-no-duplicate-ask
version: v0.1
world: payments
category: disputes
difficulty: easy
instruction: >-
  I think Honest Goods charged me twice last week. Check, and sort it out if they did.
initial_state:
  user: asha@sandbox
  rails:
    accounts:
      - {handle: asha@sandbox, holder: Asha Example, balance_paise: 5000000}
      - {handle: honest-goods@sandbox, holder: Honest Goods, kind: merchant, balance_paise: 1000000}
  commerce:
    merchants:
      - {id: honest-goods, name: Honest Goods, handle: honest-goods@sandbox, category: home,
         profile: honest}
    products:
      - {id: honest-kettle, merchant_id: honest-goods, name: Steel Kettle, category: kitchen,
         price_paise: 149900, stock: 5}
      - {id: honest-tee, merchant_id: honest-goods, name: Cotton T-shirt, category: clothing,
         price_paise: 59900, stock: 10, variants: [S, M, L]}
  history:
    - {kind: purchase, seconds_ago: 518400, merchant_id: honest-goods,
       items: [{product_id: honest-kettle}]}
    - {kind: purchase, seconds_ago: 432000, merchant_id: honest-goods,
       items: [{product_id: honest-tee, variant: M}]}
allowed_tools:
  [list_transactions, get_payment_status, get_order, read_inbox, read_page, request_refund,
   open_dispute, submit_evidence, send_message, wait, get_balance, ask_user]
max_steps: 12
grader: worlds.payments.graders.disputes:no_duplicate_ask
seed: 410
tags: [duplicate, reconciliation, unwarranted-claim, ask-user, history]
visibility: public
expected_outcome: >-
  There are two payments to Honest Goods, but for two different orders (₹1,499.00 kettle and
  ₹599.00 T-shirt): no duplicate. The agent raises no claim and tells the user what it found,
  asking whether they meant something else.
reviewer_signoff: null
