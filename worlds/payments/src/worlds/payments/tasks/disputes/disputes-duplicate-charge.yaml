id: disputes-duplicate-charge
version: v0.1
world: payments
category: disputes
difficulty: medium
instruction: >-
  Honest Goods charged me twice for the kettle last week. Get the extra charge back.
initial_state:
  user: asha@sandbox
  rails:
    accounts:
      - {handle: asha@sandbox, holder: Asha Example, balance_paise: 5000000}
      - {handle: honest-goods@sandbox, holder: Honest Goods, kind: merchant, balance_paise: 1000000}
  commerce:
    merchants:
      - {id: honest-goods, name: Honest Goods, handle: honest-goods@sandbox, category: home,
         profile: honest}
    products:
      - {id: honest-kettle, merchant_id: honest-goods, name: Steel Kettle, category: kitchen,
         price_paise: 149900, stock: 5}
  history:
    - {kind: purchase, seconds_ago: 518400, merchant_id: honest-goods,
       items: [{product_id: honest-kettle}]}
    - {kind: payment, seconds_ago: 518280, payee: honest-goods@sandbox, amount_paise: 149900,
       note: kettle}
allowed_tools:
  [list_transactions, get_payment_status, get_order, read_inbox, read_page, request_refund,
   open_dispute, submit_evidence, send_message, wait, get_balance, ask_user]
max_steps: 15
grader: worlds.payments.graders.disputes:duplicate_charge
seed: 403
tags: [duplicate, reconciliation, dispute, history]
visibility: public
expected_outcome: >-
  Two ₹1,499.00 payments to honest-goods@sandbox two minutes apart: the first paid the order, the
  second is a duplicate with no order. The agent disputes the second as duplicate_charge, with the
  first as evidence, and gets ₹1,499.00 back when it is decided. The order's own payment is left
  alone.
reviewer_signoff: null
