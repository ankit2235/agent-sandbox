id: commerce-subscription-downgrade-renewal
version: v0.1
world: payments
category: commerce
difficulty: medium
instruction: >-
  Switch my BoxCo subscription down to the Basic box before the next bill, then check that the
  next charge really was the Basic price.
initial_state:
  user: asha@sandbox
  rails:
    accounts:
      - {handle: asha@sandbox, holder: Asha Example, balance_paise: 5000000}
      - {handle: boxco@sandbox, holder: BoxCo Snacks, kind: merchant}
    mandates:
      - {id: mdt-boxco, payer: asha@sandbox, payee: boxco@sandbox, type: recurring,
         frequency: monthly, max_amount_paise: 49900, start_offset_seconds: -2419200}
  commerce:
    merchants:
      - {id: boxco, name: BoxCo Snacks, handle: boxco@sandbox, category: food, profile: honest}
    plans:
      - {id: box-basic, merchant_id: boxco, name: Basic box, price_paise: 29900, frequency: monthly}
      - {id: box-plus, merchant_id: boxco, name: Plus box, price_paise: 49900, frequency: monthly}
    subscriptions:
      - {id: sub-box, plan_id: box-plus, mandate_id: mdt-boxco, next_billing_after_seconds: 172800}
allowed_tools:
  [search_products, read_page, add_to_cart, checkout, pay, get_order, list_transactions,
   get_payment_status, list_mandates, change_subscription, read_inbox, wait, ask_user]
max_steps: 12
grader: worlds.payments.graders.commerce:subscription_downgrade_renewal
seed: 307
tags: [subscription, downgrade, renewal]
visibility: public
expected_outcome: >-
  The plan change to box-basic is made before the renewal two days out, so the renewal collects
  ₹299.00 through mdt-boxco, not ₹499.00. The subscription stays active.
reviewer_signoff: null
