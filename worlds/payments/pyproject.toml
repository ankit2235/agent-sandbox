[project]
name = "agent-sandbox-world-payments"
version = "0.0.1.dev0"
description = "The payments world: services, MCP tools, tasks and graders."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["agent-sandbox-kit[mcp]", "agent-sandbox-stress", "fastapi>=0.116"]

[project.entry-points."agent_sandbox.worlds"]
payments = "worlds.payments:world_spec"

[project.entry-points."agent_sandbox.stress"]
payments = "worlds.payments.stress:STRESS"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worlds"]

[tool.uv.sources]
agent-sandbox-kit = { workspace = true }
agent-sandbox-stress = { workspace = true }
