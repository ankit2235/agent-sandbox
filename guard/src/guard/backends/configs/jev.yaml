# TypeSafe Jev through the System One API (docs checked 2026-10-25). The response records the
# exact version served (e.g. jev-1.13.0); `jev-latest` is what the documentation shows.
kind: system_one
name: jev
endpoint: https://api.typesafe.ai/v1/systemone
model: jev-latest
api_key_env: TYPESAFE_API_KEY
timeout_s: 10
reason_threshold: 0.5
