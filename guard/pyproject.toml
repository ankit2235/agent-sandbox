[project]
name = "agent-sandbox-bench-guard"
version = "0.1.0"
description = "The guard's decision interface: DecisionRequest, Decision and the DecisionBackend protocol."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "pydantic>=2.9",
  "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guard"]
